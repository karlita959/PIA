<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIA - Agente IA</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #101b2d;
        --panel-soft: #18263d;
        --primary: #2d6cdf;
        --primary-2: #4f8ef7;
        --green: #34d399;
        --green-2: #1bbf7a;
        --text: #edf3ff;
        --muted: #9fb5d6;
        --line: rgba(255,255,255,0.09);
        --shadow: rgba(0,0,0,0.35);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #08101b 0%, #0f1d2f 100%);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }

      .app {
        width: min(1150px, 100%);
        height: 760px;
        display: grid;
        grid-template-columns: 220px 1fr;
        background: rgba(12, 20, 31, 0.9);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 25px 60px var(--shadow);
        overflow: hidden;
      }

      .sidebar {
        background: rgba(9, 16, 26, 0.95);
        border-right: 1px solid var(--line);
        padding: 20px 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 4px 18px;
      }

      .brand-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.75);
      }

      .brand h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .menu {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
      }

      .menu-item {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        text-align: left;
        font-size: 1rem;
        padding: 13px 14px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .menu-item.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        border-color: transparent;
      }

      .chat-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: rgba(9, 18, 31, 0.9);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 18, 30, 0.8);
      }

      .title-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #3a7af5, #7a68ff);
        font-weight: bold;
      }

      .title-group h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .title-group p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px 16px;
        background: rgba(6, 14, 27, 0.7);
      }

      .message {
        display: flex;
        margin-bottom: 20px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 72%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.5;
        font-size: 0.96rem;
      }

      .bot .bubble {
        background: rgba(44, 79, 128, 0.22);
        border: 1px solid rgba(96, 165, 250, 0.3);
        border-bottom-left-radius: 6px;
      }

      .user .bubble {
        background: linear-gradient(135deg, var(--green), var(--green-2));
        color: #07130f;
        border-bottom-right-radius: 6px;
      }

      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 24px 16px;
        background: rgba(9, 18, 31, 0.9);
      }

      .chip {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 16px 24px 22px;
        border-top: 1px solid var(--line);
        background: rgba(12, 20, 31, 0.85);
      }

      .composer input {
        flex: 1;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.9);
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }

      .composer button {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 14px 22px;
        background: linear-gradient(135deg, var(--green), var(--green-2));
        color: #06130f;
        font-weight: 700;
        cursor: pointer;
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .bubble {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-dot"></span>
          <h2>IA</h2>
        </div>

        <div class="menu">
          <button class="menu-item active" type="button">Chat</button>
          <button class="menu-item" type="button">Aprender</button>
          <button class="menu-item" type="button">Ejemplos</button>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <div class="title-group">
            <div class="avatar">AI</div>
            <div>
              <h3>Agente IA</h3>
              <p>En línea</p>
            </div>
          </div>
        </header>

        <section class="messages" id="messages">
          <div class="message bot">
            <div class="bubble">¡Hola! Soy tu agente de IA para aprender programación. Puedo ayudarte con HTML, CSS, JavaScript, variables, funciones y lógica.</div>
          </div>
        </section>

        <div class="quick-actions">
          <button class="chip" type="button">¿Qué es HTML?</button>
          <button class="chip" type="button">Explica JS</button>
          <button class="chip" type="button">¿Qué es una función?</button>
          <button class="chip" type="button">Dime un ejemplo</button>
        </div>

        <div class="composer">
          <input id="input" type="text" placeholder="Escribe tu pregunta..." />
          <button id="send" type="button">Enviar</button>
        </div>
      </main>
    </div>

    <script>
      const messages = document.getElementById("messages");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const chips = document.querySelectorAll(".chip");
      const menuItems = document.querySelectorAll(".menu-item");

      function addMessage(text, sender) {
        const row = document.createElement("div");
        row.className = `message ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
      }

      function getResponse(prompt) {
        const text = prompt.toLowerCase();

        if (text.includes("html")) {
          return "HTML es el lenguaje para estructurar una página web. Sirve para crear títulos, párrafos, botones, listas, imágenes y secciones.";
        }

        if (text.includes("css")) {
          return "CSS se usa para dar estilo a la página: colores, márgenes, tamaños, fondos, tipografías y diseño visual.";
        }

        if (text.includes("javascript") || text.includes("js")) {
          return "JavaScript hace que una página sea interactiva. Permite mostrar mensajes, cambiar texto, validar formularios y responder a acciones del usuario.";
        }

        if (text.includes("variable")) {
          return 'Una variable es un espacio para guardar información. Ejemplo: let nombre = "Ana";';
        }

        if (text.includes("funcion")) {
          return 'Una función es un bloque de código reutilizable. Ejemplo: function saludar() { console.log("Hola"); }';
        }

        if (text.includes("if") || text.includes("condicion")) {
          return 'La condición if sirve para ejecutar una acción solo si se cumple una regla. Ejemplo: if (edad >= 18) { console.log("Eres mayor de edad"); }';
        }

        if (text.includes("for") || text.includes("bucle")) {
          return "Un bucle for repite instrucciones varias veces. Se usa para recorrer listas o ejecutar acciones repetitivas.";
        }

        if (text.includes("ejemplo") || text.includes("ejemplos")) {
          return 'Ejemplo simple: let edad = 20; console.log("Mi edad es " + edad);';
        }

        if (text.includes("hola")) {
          return "¡Hola! Puedo ayudarte con HTML, CSS, JavaScript, variables, funciones y lógica de programación.";
        }

        return "Puedo ayudarte con HTML, CSS, JavaScript, variables, funciones y lógica de programación. Pregúntame otra cosa.";
      }

      function processPrompt(rawText) {
        const text = rawText.trim();
        if (!text) return;

        addMessage(text, "user");
        const answer = getResponse(text);
        setTimeout(() => addMessage(answer, "bot"), 200);
      }

      sendBtn.addEventListener("click", function () {
        processPrompt(input.value);
        input.value = "";
        input.focus();
      });

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          processPrompt(input.value);
          input.value = "";
          input.focus();
        }
      });

      chips.forEach((chip) => {
        chip.addEventListener("click", function () {
          const text = chip.textContent.trim();
          processPrompt(text);
        });
      });

      menuItems.forEach((item) => {
        item.addEventListener("click", function () {
          menuItems.forEach((button) => button.classList.remove("active"));
          item.classList.add("active");
        });
      });
    </script>
  </body>
</html>
