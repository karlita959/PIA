<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIA - Agente IA</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg2: #111827;
        --panel: #131c2d;
        --primary: #3b82f6;
        --green: #22c55e;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --line: rgba(255,255,255,0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0b1020, #111827 60%, #0f172a);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }

      .app {
        width: 100%;
        max-width: 1100px;
        height: 760px;
        display: grid;
        grid-template-columns: 220px 1fr;
        background: rgba(19, 28, 45, 0.9);
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      }

      .sidebar {
        background: rgba(15, 23, 42, 0.9);
        border-right: 1px solid var(--line);
        padding: 24px 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 18px rgba(34, 197, 94, 0.8);
      }

      .brand h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .menu {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .menu-item {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        padding: 12px 14px;
        border-radius: 12px;
        text-align: left;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .menu-item.active {
        background: linear-gradient(135deg, var(--primary), #2563eb);
        border: none;
      }

      .chat-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .topbar {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
        background: rgba(17, 24, 39, 0.6);
      }

      .title-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        font-weight: bold;
      }

      .title-group h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .title-group p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 22px 24px;
        background: rgba(10, 15, 27, 0.7);
      }

      .message {
        display: flex;
        margin-bottom: 20px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 70%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.6;
        font-size: 0.96rem;
      }

      .bot .bubble {
        background: rgba(59, 130, 246, 0.18);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-bottom-left-radius: 6px;
      }

      .user .bubble {
        background: linear-gradient(135deg, var(--green), #10b981);
        border-bottom-right-radius: 6px;
      }

      .quick-actions {
        padding: 0 24px 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        border: 1px solid var(--line);
        background: rgba(31, 41, 55, 0.9);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 999px;
        cursor: pointer;
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 16px 24px 22px;
        border-top: 1px solid var(--line);
        background: rgba(17, 24, 39, 0.7);
      }

      .composer input {
        flex: 1;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
      }

      .composer button {
        border: none;
        border-radius: 12px;
        padding: 14px 22px;
        font-weight: bold;
        cursor: pointer;
        background: linear-gradient(135deg, var(--green), #16a34a);
        color: white;
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .bubble {
          max-width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="dot"></span>
          <h2>IA</h2>
        </div>

        <div class="menu">
          <button class="menu-item active">Chat</button>
          <button class="menu-item">Aprender</button>
          <button class="menu-item">Ejemplos</button>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <div class="title-group">
            <div class="avatar">AI</div>
            <div>
              <h3>Agente IA</h3>
              <p>En línea</p>
            </div>
          </div>
        </header>

        <section class="messages" id="messages">
          <div class="message bot">
            <div class="bubble">
              ¡Hola! Soy tu agente de IA para aprender programación. Puedo ayudarte con HTML, CSS, JavaScript, variables, funciones y lógica.
            </div>
          </div>
        </section>

        <div class="quick-actions">
          <button class="chip">¿Qué es HTML?</button>
          <button class="chip">Explica JS</button>
          <button class="chip">¿Qué es una función?</button>
        </div>

        <div class="composer">
          <input id="input" type="text" placeholder="Escribe tu pregunta..." />
          <button id="send">Enviar</button>
        </div>
      </main>
    </div>

    <script>
      const messages = document.getElementById("messages");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const chips = document.querySelectorAll(".chip");

      function addMessage(text, sender) {
        const row = document.createElement("div");
        row.className = `message ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
      }

      function getResponse(prompt) {
        const p = prompt.toLowerCase();

        if (p.includes("html")) {
          return "HTML es el lenguaje que se usa para estructurar una página web. Sirve para crear títulos, párrafos, botones, imágenes y secciones.";
        }

        if (p.includes("css")) {
          return "CSS se usa para darle estilo a la página: colores, fuentes, márgenes, fondos, tamaños y diseño visual.";
        }

        if (p.includes("javascript") || p.includes("js")) {
          return "JavaScript hace que la página sea interactiva. Se usa para mostrar mensajes, validar formularios, cambiar contenido y hacer lógica.";
        }

        if (p.includes("variable")) {
          return 'Una variable es un contenedor para guardar información. Ejemplo: let nombre = "Ana";';
        }

        if (p.includes("funcion")) {
          return 'Una función es un bloque de código reutilizable. Ejemplo: function saludar() { console.log("Hola"); }';
        }

        if (p.includes("if") || p.includes("condicion")) {
          return 'La condición if sirve para ejecutar algo si se cumple una regla. Ejemplo: if (edad >= 18) { console.log("Eres mayor de edad"); }';
        }

        if (p.includes("for") || p.includes("bucle")) {
          return "Un for sirve para repetir instrucciones varias veces. Se usa mucho para recorrer listas y arreglos.";
        }

        if (p.includes("hola")) {
          return "¡Hola! Puedo ayudarte a aprender HTML, CSS, JavaScript, variables y funciones.";
        }

        if (p.includes("ejemplo")) {
          return 'Ejemplo básico: let edad = 20; console.log("Mi edad es " + edad);';
        }

        return "Puedo ayudarte con HTML, CSS, JavaScript, variables, funciones y lógica de programación. Pregúntame otra cosa.";
      }

      function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        const answer = getResponse(text);
        setTimeout(() => {
          addMessage(answer, "bot");
        }, 300);
      }

      sendBtn.addEventListener("click", sendMessage);

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendMessage();
        }
      });

      chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          input.value = chip.textContent;
          sendMessage();
        });
      });
    </script>
  </body>
</html>
